# FREQCAL config - one key=value per line, '#' starts a comment.
# ref    : leave out = automatic: the station is chosen from the dial (tone 200..3300 Hz):
#          WWV/BPM 2.5/5/10/15 MHz, WWV 20/25 MHz, RWM 4996/9996/14996 kHz, CHU 3330/7850/14670 kHz,
#          GPSDO 10 MHz. Set ref=<Hz> only for another carrier (e.g. a GPS-locked beacon).
# win    : one measurement window (s), 5..120. HF skywave: 60
# search : leave out = auto: +-1.5 ppm of the reference (10 MHz: +-15 Hz). Or a fixed width in Hz (3..80)
# reacq  : search the carrier again every N windows (3), so the app cannot stay on a wrong signal
# minsnr : minimum S/N (dB, per 0.05 Hz bin) to accept a window
# minsep : the strongest carrier must be this many dB above a 2nd one (WWV + WWVH/BPM), else rejected
# maxcv  : max amplitude variation (std/mean) of a steady carrier; pulses and CW ID are skipped (0.6)
# step   : ppm change per +1 % REF Adjust. IC-705 measured: about 0.10
# cal    : !=0 re-measures the step: you set REF Adjust higher by this many % (e.g. 1.0). 0 = off
# log    : 1 = write FREQCAL.TXT
win=60
minsnr=12
minsep=6
step=0.10
cal=0
log=1
